[package]
name = "roper"
version = "0.1.0-alpha.1"
edition = "2024"
authors = ["RMML"]
description = "Modern dual-pane rap lyric editor"
license = "Unlicense"
homepage = "https://github.com/dsrrmml/roper"
repository = "https://github.com/dsrrmml/roper"

[dependencies]
gtk = { package = "gtk4", version = "=0.10.3" }
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png"] }
md5 = "=0.8.1"
png = "=0.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "=3.27.0"
